/* One note per calendar day, in order, starting Sept 20, 2026 */
function dailyNote() {
  const t = new Date();
  const day = Math.floor((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(2026, 8, 20)) / 864e5);
  return notes[((day % notes.length) + notes.length) % notes.length];
}
$("dailyNote").textContent = dailyNote();

function tick() {
  const diff = weddingDate.getTime() - Date.now();
  if (diff <= 0) {
    $("days").textContent = "000";
    ["hours", "minutes", "seconds"].forEach(i => $(i).textContent = "00");
    $("dailyNote").textContent = "Today is the day. Go get married. ♡";
    return;
  }
  const s = Math.floor(diff / 1000);
  $("days").textContent = pad(Math.floor(s / 86400), 3);
  $("hours").textContent = pad(Math.floor((s % 86400) / 3600));
  $("minutes").textContent = pad(Math.floor((s % 3600) / 60));
  $("seconds").textContent = pad(s % 60);
}

  clearTimeout(timer);
  timer = setTimeout(() => t.classList.remove("show"), 2400);
});
