<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Rajdeep &amp; Inderjeet · May 2, 2027</title>
  <meta name="description" content="A little countdown to forever.">
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:title" content="Rajdeep &amp; Inderjeet · May 2, 2027">
  <meta property="og:description" content="A little countdown to forever.">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#f7f4ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Italiana&family=Oooh+Baby&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivory: #f7f4ed;
      --paper: #fbfaf6;
      --navy: #18283b;
      --navy-soft: #304258;
      --gold: #b39a68;
      --blush: #d9b9b5;
      --sage: #b9c4b5;
      --line: rgba(24, 40, 59, 0.14);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--ivory);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 15%, rgba(217,185,181,.17), transparent 24%),
        radial-gradient(circle at 88% 78%, rgba(185,196,181,.16), transparent 24%),
        var(--ivory);
      color: var(--navy);
      font-family: "Playfair Display", Georgia, serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding:
        max(28px, env(safe-area-inset-top))
        22px
        max(26px, env(safe-area-inset-bottom));
    }

    /* Decorative corners */
    .corner {
      position: fixed;
      width: 85px;
      height: 85px;
      pointer-events: none;
      opacity: .65;
    }
    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      border-color: var(--gold);
      border-style: solid;
    }
    .corner::before { width: 55px; height: 55px; }
    .corner::after { width: 7px; height: 7px; border-width: 1px; border-radius: 50%; }

    .top-left { top: 13px; left: 13px; }
    .top-left::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .top-left::after { top: 5px; left: 63px; }

    .bottom-right { bottom: 13px; right: 13px; transform: rotate(180deg); }
    .bottom-right::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .bottom-right::after { top: 5px; left: 63px; }

    /* Header */
    header {
      text-align: center;
      padding-top: 28px;
      animation: fadeUp 1s ease both;
    }

    .eyebrow {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--navy-soft);
      opacity: .7;
      margin-bottom: 22px;
    }

    .names {
      font-family: "Italiana", serif;
      font-size: clamp(52px, 15vw, 92px);
      line-height: .88;
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .amp {
      display: block;
      font-family: "Oooh Baby", cursive;
      font-size: .46em;
      color: var(--gold);
      line-height: .8;
      margin: 12px 0 9px;
      transform: rotate(-4deg);
    }

    .date {
      margin-top: 27px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--navy-soft);
    }

    /* Main */
    main {
      width: min(850px, 100%);
      margin: auto;
      padding: 55px 0 45px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .unit {
      position: relative;
      text-align: center;
      padding: 29px 7px 27px;
    }

    .unit:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 29%;
      height: 42%;
      width: 1px;
      background: var(--line);
    }

    .number {
      font-family: "DM Mono", monospace;
      font-size: clamp(30px, 7vw, 58px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 12px;
      font-family: "DM Mono", monospace;
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .58;
    }

    .ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 42px 0 0;
    }
    .ornament-line { width: 38px; height: 1px; background: var(--gold); opacity: .65; }
    .ornament-dot { width: 5px; height: 5px; border: 1px solid var(--gold); border-radius: 50%; }

    /* Daily note */
    .daily {
      text-align: center;
      margin: 43px auto 0;
      max-width: 560px;
      padding: 0 15px;
      animation: fadeUp 1s .25s ease both;
    }

    .daily-label {
      font-family: "DM Mono", monospace;
      font-size: 8px;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: .5;
      margin-bottom: 14px;
    }

    .note {
      font-family: "Oooh Baby", cursive;
      font-size: clamp(25px, 6vw, 36px);
      line-height: 1.2;
      color: var(--navy-soft);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: auto;
      padding-top: 30px;
      animation: fadeUp 1s .45s ease both;
    }

    .footer-text {
      font-family: "DM Mono", monospace;
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .43;
    }

    .heart {
      display: block;
      margin: 13px auto 0;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      position: relative;
      transition: transform .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .heart:hover { transform: scale(1.12); }
    .heart:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 50%; }
    .heart::before {
      content: "♡";
      font-family: serif;
      font-size: 27px;
      color: var(--gold);
      position: absolute;
      left: 3px;
      top: 0;
    }

    .heart-message {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      transform: translate(-50%, 15px);
      background: var(--navy);
      color: var(--ivory);
      padding: 11px 17px;
      border-radius: 3px;
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .08em;
      opacity: 0;
      pointer-events: none;
      transition: .35s ease;
      white-space: nowrap;
    }
    .heart-message.show { opacity: 1; transform: translate(-50%, 0); }

    /* Mobile */
    @media (max-width: 520px) {
      .page { padding-left: 17px; padding-right: 17px; }
      header { padding-top: 24px; }
      .names { font-size: clamp(50px, 17vw, 76px); }
      main { padding-top: 48px; }
      .unit { padding-top: 24px; padding-bottom: 23px; }
      .number { font-size: clamp(25px, 8.5vw, 40px); }
      .label { font-size: 7px; letter-spacing: .12em; }
      .corner { opacity: .45; transform: scale(.72); transform-origin: top left; }
      .bottom-right { transform: rotate(180deg) scale(.72); transform-origin: bottom right; }
    }

    @media (max-width: 350px) {
      .names { font-size: 48px; }
      .number { font-size: 23px; }
      .label { font-size: 6px; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <header>
      <div class="eyebrow">A little countdown to forever</div>

      <h1 class="names" style="margin:0">
        Rajdeep
        <span class="amp">&amp;</span>
        Inderjeet
      </h1>

      <div class="date">May 02 · 2027</div>
    </header>

    <main>
      <section class="countdown" aria-label="Wedding countdown">
        <div class="unit">
          <div class="number" id="days">000</div>
          <div class="label">Days</div>
        </div>
        <div class="unit">
          <div class="number" id="hours">00</div>
          <div class="label">Hours</div>
        </div>
        <div class="unit">
          <div class="number" id="minutes">00</div>
          <div class="label">Minutes</div>
        </div>
        <div class="unit">
          <div class="number" id="seconds">00</div>
          <div class="label">Seconds</div>
        </div>
      </section>

      <div class="ornament">
        <span class="ornament-line"></span>
        <span class="ornament-dot"></span>
        <span class="ornament-line"></span>
      </div>

      <section class="daily">
        <div class="daily-label">Today's little thought</div>
        <div class="note" id="dailyNote"></div>
      </section>
    </main>

    <footer>
      <div class="footer-text">Two hearts · one date · a lifetime ahead</div>
      <button class="heart" id="heart" type="button" aria-label="Click for a surprise"></button>
    </footer>

    <div class="heart-message" id="heartMessage" role="status">
      See you at the mandap. ♡
    </div>

  </div>

  <script>
    /*
      WEDDING COUNTDOWN — May 2, 2027, 12:00 AM Eastern (EDT, UTC-4).
      Fixed time zone so everyone, everywhere, sees the same countdown.
      To change the date, edit the line below.
    */
    const weddingDate = new Date("2027-05-02T00:00:00-04:00");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const noteEl = document.getElementById("dailyNote");

    const pad = (n, len = 2) => String(n).padStart(len, "0");

    /* Daily note: one per calendar day, same for everyone */
    const notes = [
      "One day closer to forever.",
      "Somewhere between now and May 2nd, magic is waiting.",
      "The best part of the story is still ahead.",
      "Today is one tiny step closer to our day.",
      "A little less waiting. A little more excitement.",
      "Counting moments, not just days.",
      "Our forever is getting closer.",
      "Another sunrise closer to May.",
      "The countdown feels a little sweeter today.",
      "One date. Two people. One beautiful beginning.",
      "There is something lovely about having a day to look forward to.",
      "Slowly, quietly, we're getting there.",
      "May 2nd is making its way toward us.",
      "A future worth counting down to.",
      "Every day brings us a little closer.",
      "Today belongs to the waiting.",
      "The story keeps getting closer to its next chapter.",
      "Just a few more ordinary days before an extraordinary one.",
      "Keep this day. We're getting closer.",
      "Our favorite date is on its way.",
      "The little things are becoming part of the big picture.",
      "Another day in the countdown.",
      "Something beautiful is getting closer.",
      "The wait is part of the story too.",
      "Here's to all the days between now and then.",
      "Our day is slowly becoming real.",
      "A little closer than yesterday.",
      "There is a whole lifetime waiting after this countdown.",
      "Today, we're one day closer.",
      "The calendar knows something special is coming.",
      "May is waiting for us.",
      "A beautiful beginning is getting closer.",
      "The countdown continues.",
      "Some days are meant to be remembered.",
      "This one is worth counting.",
      "Another little square crossed off the calendar.",
      "The closer it gets, the more real it feels.",
      "Our forever has a date.",
      "One day at a time.",
      "The sweetest kind of waiting.",
      "Soon enough, today will be a memory.",
      "Keep counting.",
      "We're getting closer to the moment.",
      "The days are passing. The excitement is growing.",
      "A little reminder: something wonderful is coming.",
      "The next chapter has a date.",
      "May 2nd, we're coming for you.",
      "Almost there, one day at a time.",
      "Today is part of the journey.",
      "The countdown is our tiny piece of anticipation.",
      "There is beauty in having something to look forward to.",
      "Another day closer to celebrating us.",
      "The wait won't last forever.",
      "Our date is getting closer.",
      "A day closer to the beginning of forever.",
      "The calendar keeps moving in our favor.",
      "Just imagine how this will feel when the countdown reaches zero.",
      "Today, tomorrow, and then our day.",
      "The little number gets smaller. The excitement gets bigger.",
      "Our story is heading somewhere beautiful.",
      "One more day tucked into the countdown.",
      "We're getting there.",
      "The wait is temporary. The memories will last.",
      "May is slowly approaching.",
      "Another day. Another reason to smile.",
      "The countdown has a destination.",
      "Something beautiful is on the horizon.",
      "Our favorite day is getting closer.",
      "A few more pages before this chapter turns.",
      "Today is one of the days we'll look back on.",
      "The clock keeps moving.",
      "Soon, this countdown will be a memory too.",
      "One tiny number at a time.",
      "Closer to the flowers, the music, the laughter.",
      "Closer to our day.",
      "Every day makes May 2nd feel a little nearer.",
      "The wait has its own kind of magic.",
      "Today counts.",
      "Another little step toward forever.",
      "The date is getting closer, quietly and surely.",
      "Our next big memory is on the calendar.",
      "Soon we'll stop counting and start celebrating.",
      "The countdown keeps our secret for a little longer.",
      "Another day closer to the beginning.",
      "There is something waiting at the end of this number.",
      "Keep the date close.",
      "We're almost at another milestone.",
      "One more day in our story.",
      "The best days sometimes begin with a countdown.",
      "May 2nd is getting closer.",
      "Today, tomorrow, and every day after.",
      "The number changes. The destination doesn't.",
      "A little closer to the day we've been waiting for.",
      "This countdown is made of tiny moments.",
      "And then one day, the waiting ends.",
      "Our day is coming."
    ];

    function getDailyNote() {
      const t = new Date();
      const start = Date.UTC(2026, 0, 1);
      const current = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
      const dayNumber = Math.floor((current - start) / 86400000);
      return notes[((dayNumber % notes.length) + notes.length) % notes.length];
    }

    noteEl.textContent = getDailyNote();

    function updateCountdown() {
      const diff = weddingDate.getTime() - Date.now();

      if (diff <= 0) {
        daysEl.textContent = "000";
        hoursEl.textContent = minutesEl.textContent = secondsEl.textContent = "00";
        noteEl.textContent = "Today is the day. ♡";
        return;
      }

      const total = Math.floor(diff / 1000);
      daysEl.textContent = pad(Math.floor(total / 86400), 3);
      hoursEl.textContent = pad(Math.floor((total % 86400) / 3600));
      minutesEl.textContent = pad(Math.floor((total % 3600) / 60));
      secondsEl.textContent = pad(total % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* Heart surprise */
    const heart = document.getElementById("heart");
    const heartMessage = document.getElementById("heartMessage");
    let heartTimer;

    heart.addEventListener("click", () => {
      heartMessage.classList.add("show");
      clearTimeout(heartTimer);
      heartTimer = setTimeout(() => heartMessage.classList.remove("show"), 2200);
    });
  </script>

</body>
</html>
