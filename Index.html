<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Countdown</title>

  <meta name="theme-color" content="#f7f4ed">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Italiana&family=Oooh+Baby&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivory: #f7f4ed;
      --paper: #fbfaf6;
      --navy: #18283b;
      --navy-soft: #34465b;
      --gold: #b39a68;
      --blush: #d8b9b5;
      --sage: #bac5b7;
      --line: rgba(24, 40, 59, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(216, 185, 181, 0.18),
          transparent 24%
        ),
        radial-gradient(
          circle at 88% 80%,
          rgba(186, 197, 183, 0.18),
          transparent 25%
        ),
        var(--ivory);
      color: var(--navy);
      font-family: "Playfair Display", serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding:
        max(28px, env(safe-area-inset-top))
        22px
        max(25px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* =========================
       DECORATIVE CORNERS
       ========================= */

    .corner {
      position: fixed;
      width: 75px;
      height: 75px;
      pointer-events: none;
      opacity: 0.55;
    }

    .corner::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      border: solid var(--gold);
    }

    .corner::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border: 1px solid var(--gold);
      border-radius: 50%;
    }

    .top-left {
      top: 14px;
      left: 14px;
    }

    .top-left::before {
      top: 0;
      left: 0;
      border-width: 1px 0 0 1px;
    }

    .top-left::after {
      top: 5px;
      left: 60px;
    }

    .bottom-right {
      right: 14px;
      bottom: 14px;
      transform: rotate(180deg);
    }

    .bottom-right::before {
      top: 0;
      left: 0;
      border-width: 1px 0 0 1px;
    }

    .bottom-right::after {
      top: 5px;
      left: 60px;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      text-align: center;
      padding-top: 25px;
      animation: fadeUp 0.9s ease both;
    }

    .eyebrow {
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.27em;
      text-transform: uppercase;
      opacity: 0.62;
      margin-bottom: 22px;
    }

    .names {
      font-family: "Italiana", serif;
      font-size: clamp(55px, 15vw, 92px);
      line-height: 0.84;
      letter-spacing: -0.035em;
      font-weight: 400;
    }

    .ampersand {
      display: block;
      font-family: "Oooh Baby", cursive;
      color: var(--gold);
      font-size: 0.46em;
      line-height: 0.9;
      margin: 12px 0;
      transform: rotate(-4deg);
    }

    .date {
      margin-top: 27px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* =========================
       MAIN
       ========================= */

    main {
      width: min(850px, 100%);
      margin: auto;
      padding: 55px 0 40px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .unit {
      position: relative;
      text-align: center;
      padding: 30px 6px 27px;
    }

    .unit:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 29%;
      height: 42%;
      width: 1px;
      background: var(--line);
    }

    .number {
      font-family: "DM Mono", monospace;
      font-weight: 300;
      font-size: clamp(28px, 7vw, 57px);
      line-height: 1;
      letter-spacing: -0.07em;
    }

    .label {
      margin-top: 12px;
      font-family: "DM Mono", monospace;
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* =========================
       ORNAMENT
       ========================= */

    .ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin-top: 42px;
    }

    .ornament-line {
      width: 38px;
      height: 1px;
      background: var(--gold);
      opacity: 0.65;
    }

    .ornament-dot {
      width: 5px;
      height: 5px;
      border: 1px solid var(--gold);
      border-radius: 50%;
    }

    /* =========================
       DAILY NOTE
       ========================= */

    .daily {
      text-align: center;
      max-width: 570px;
      margin: 42px auto 0;
      padding: 0 15px;
      animation: fadeUp 0.9s 0.2s ease both;
    }

    .daily-label {
      font-family: "DM Mono", monospace;
      font-size: 8px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 14px;
    }

    .note {
      font-family: "Oooh Baby", cursive;
      font-size: clamp(25px, 6vw, 37px);
      line-height: 1.2;
      color: var(--navy-soft);
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      margin-top: auto;
      padding-top: 25px;
      text-align: center;
      animation: fadeUp 0.9s 0.4s ease both;
    }

    .footer-text {
      font-family: "DM Mono", monospace;
      font-size: 7px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    .heart {
      width: 27px;
      height: 27px;
      margin: 12px auto 0;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: transform 0.25s ease;
    }

    .heart:hover {
      transform: scale(1.15);
    }

    .heart::before {
      content: "♡";
      position: absolute;
      left: 0;
      top: -5px;
      font-family: Georgia, serif;
      font-size: 29px;
      color: var(--gold);
    }

    /* =========================
       SURPRISE MESSAGE
       ========================= */

    .heart-message {
      position: fixed;
      left: 50%;
      bottom: 28px;

      transform: translate(-50%, 15px);

      background: var(--navy);
      color: var(--ivory);

      padding: 11px 17px;
      border-radius: 3px;

      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.08em;

      opacity: 0;
      pointer-events: none;

      transition: 0.35s ease;

      white-space: nowrap;
    }

    .heart-message.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       ANIMATION
       ========================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 520px) {

      .page {
        padding-left: 17px;
        padding-right: 17px;
      }

      .names {
        font-size: clamp(52px, 17vw, 78px);
      }

      main {
        padding-top: 48px;
      }

      .unit {
        padding-top: 25px;
        padding-bottom: 23px;
      }

      .number {
        font-size: clamp(24px, 8.5vw, 40px);
      }

      .label {
        font-size: 7px;
        letter-spacing: 0.11em;
      }

      .corner {
        transform: scale(0.72);
        transform-origin: top left;
        opacity: 0.4;
      }

      .bottom-right {
        transform: rotate(180deg) scale(0.72);
        transform-origin: bottom right;
      }
    }

    @media (max-width: 350px) {

      .names {
        font-size: 48px;
      }

      .number {
        font-size: 22px;
      }

      .label {
        font-size: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

      <div class="eyebrow">
        A little countdown to forever
      </div>

      <div class="names">
        Rajdeep

        <span class="ampersand">&amp;</span>

        Inderjeet
      </div>

      <div class="date">
        May 02 · 2027
      </div>

    </header>


    <!-- =========================
         MAIN
         ========================= -->

    <main>

      <section class="countdown">

        <div class="unit">
          <div class="number" id="days">000</div>
          <div class="label">Days</div>
        </div>

        <div class="unit">
          <div class="number" id="hours">00</div>
          <div class="label">Hours</div>
        </div>

        <div class="unit">
          <div class="number" id="minutes">00</div>
          <div class="label">Minutes</div>
        </div>

        <div class="unit">
          <div class="number" id="seconds">00</div>
          <div class="label">Seconds</div>
        </div>

      </section>


      <div class="ornament">
        <span class="ornament-line"></span>
        <span class="ornament-dot"></span>
        <span class="ornament-line"></span>
      </div>


      <!-- =========================
           DAILY MESSAGE
           ========================= -->

      <section class="daily">

        <div class="daily-label">
          Today's little thought
        </div>

        <div class="note" id="dailyNote">
          One day closer to forever.
        </div>

      </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

      <div class="footer-text">
        Two hearts · one date · a lifetime ahead
      </div>

      <div
        class="heart"
        id="heart"
        aria-label="Click for a surprise"
        role="button"
        tabindex="0">
      </div>

    </footer>


    <div class="heart-message" id="heartMessage">
      See you at the mandap. ♡
    </div>

  </div>


  <script>

    /* =====================================================
       WEDDING COUNTDOWN
       May 02, 2027

       IMPORTANT:
       Months are zero-based in JavaScript.
       4 = May.

       This construction is intentionally used instead of
       new Date("2027-05-02") for better Safari/iPhone
       compatibility.
       ===================================================== */

    const weddingDate = new Date(
      2027,
      4,
      2,
      0,
      0,
      0
    );


    const daysElement =
      document.getElementById("days");

    const hoursElement =
      document.getElementById("hours");

    const minutesElement =
      document.getElementById("minutes");

    const secondsElement =
      document.getElementById("seconds");


    function pad(number, length = 2) {
      return String(number).padStart(length, "0");
    }


    function updateCountdown() {

      const now = new Date();

      const difference =
        weddingDate.getTime() -
        now.getTime();


      /*
        Wedding day has arrived.
      */

      if (difference <= 0) {

        daysElement.textContent = "000";
        hoursElement.textContent = "00";
        minutesElement.textContent = "00";
        secondsElement.textContent = "00";

        return;
      }


      const totalSeconds =
        Math.floor(difference / 1000);


      const days =
        Math.floor(totalSeconds / 86400);


      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      daysElement.textContent =
        pad(days, 3);

      hoursElement.textContent =
        pad(hours);

      minutesElement.textContent =
        pad(minutes);

      secondsElement.textContent =
        pad(seconds);
    }


    /*
      Run immediately so there is no delay.
    */

    updateCountdown();


    /*
      Update every second.
    */

    setInterval(
      updateCountdown,
      1000
    );


    /* =====================================================
       DAILY NOTE

       The note is based on the calendar date.

       That means:
       - It does NOT randomly change.
       - It stays the same throughout the day.
       - It automatically changes on the next day.
       - Everyone visiting the website that day sees
         the same message.
       ===================================================== */

    const notes = [

      "One day closer to forever.",

      "Counting moments, not just days.",

      "Our favorite date is on its way.",

      "A little less waiting. A little more excitement.",

      "Something beautiful is getting closer.",

      "The best part of the story is still ahead.",

      "Today is one tiny step closer to our day.",

      "A future worth counting down to.",

      "Our forever has a date.",

      "Another day closer to celebrating us.",

      "May 2nd is making its way toward us.",

      "The sweetest kind of waiting.",

      "One more day tucked into the countdown.",

      "Our day is slowly becoming real.",

      "There is something lovely about having a day to look forward to.",

      "The closer it gets, the more real it feels.",

      "Another sunrise closer to May.",

      "The wait is part of the story too.",

      "One date. Two people. One beautiful beginning.",

      "The calendar keeps moving.",

      "A little closer than yesterday.",

      "Today counts.",

      "Our story is heading somewhere beautiful.",

      "The countdown continues.",

      "The number gets smaller. The excitement gets bigger.",

      "Another little step toward forever.",

      "The date is getting closer, quietly and surely.",

      "Just imagine how this will feel when the countdown reaches zero.",

      "Soon enough, today will be a memory.",

      "The best days sometimes begin with a countdown.",

      "One more day in our story.",

      "Something wonderful is coming.",

      "Keep the date close.",

      "We're getting there.",

      "May is waiting for us.",

      "The wait won't last forever.",

      "A little closer to the day we've been waiting for.",

      "Every day makes May 2nd feel a little nearer.",

      "The wait has its own kind of magic.",

      "Soon we'll stop counting and start celebrating.",

      "One tiny number at a time.",

      "The countdown has a destination.",

      "Another day. Another reason to smile.",

      "A beautiful beginning is getting closer.",

      "Today is part of the journey.",

      "There is beauty in having something to look forward to.",

      "Our next big memory is on the calendar.",

      "The clock keeps moving.",

      "And then one day, the waiting ends."

    ];


    function getDailyNote() {

      const today = new Date();


      /*
        Use local calendar dates rather than time of day.
      */

      const year =
        today.getFullYear();

      const month =
        today.getMonth();

      const day =
        today.getDate();


      /*
        Create a stable number for the current day.
      */

      const currentDate =
        new Date(
          year,
          month,
          day
        );


      const startingDate =
        new Date(
          2026,
          0,
          1
        );


      const difference =
        currentDate.getTime() -
        startingDate.getTime();


      const dayNumber =
        Math.floor(
          difference / 86400000
        );


      const index =
        ((dayNumber % notes.length) +
          notes.length) %
        notes.length;


      return notes[index];
    }


    document.getElementById(
      "dailyNote"
    ).textContent =
      getDailyNote();


    /* =====================================================
       LITTLE HEART SURPRISE
       ===================================================== */

    const heart =
      document.getElementById("heart");

    const heartMessage =
      document.getElementById("heartMessage");


    function showHeartMessage() {

      heartMessage.classList.add("show");


      setTimeout(() => {

        heartMessage.classList.remove("show");

      }, 2200);
    }


    heart.addEventListener(
      "click",
      showHeartMessage
    );


    heart.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          showHeartMessage();
        }
      }
    );

  </script>

</body>
</html>
